name: Release

# Pushing a tag like v1.2.3 builds a signed release APK, attaches it to a GitHub Release, and
# deploys the web app (see the web job below).
# Needs four repository secrets (Settings > Secrets and variables > Actions):
#   ANDROID_KEYSTORE_BASE64    the .jks / .keystore file, base64 encoded
#   ANDROID_KEYSTORE_PASSWORD  store password
#   ANDROID_KEY_ALIAS          key alias
#   ANDROID_KEY_PASSWORD       key password
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  apk:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # The runner image already has the Android SDK (ANDROID_HOME); Gradle downloads any missing
      # platform once the licenses are accepted.
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - run: npm ci

      # Do not ship a build that fails the checks.
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test -- --ci

      - name: Stamp the version from the tag
        run: node scripts/set-version.js "$GITHUB_REF_NAME"

      - name: Generate the Android project
        run: npx expo prebuild --platform android --no-install --clean

      - name: Restore the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ANDROID_KEYSTORE_BASE64 is not set; refusing to publish an APK signed with the debug key." >&2
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          echo "LINEWISE_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Build the release APK
        working-directory: android
        env:
          LINEWISE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          LINEWISE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          LINEWISE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon --console=plain

      - name: Check the APK
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          node scripts/check-offline.js --apk "$APK"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs "$APK" | tee "$RUNNER_TEMP/certs.txt"
          if grep -qi "Android Debug" "$RUNNER_TEMP/certs.txt"; then
            echo "The APK is signed with the debug key." >&2
            exit 1
          fi

      - name: Name the files
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/release/app-release.apk "release/linewise-${GITHUB_REF_NAME}.apk"
          (cd release && sha256sum "linewise-${GITHUB_REF_NAME}.apk" > "linewise-${GITHUB_REF_NAME}.apk.sha256")

      - name: Publish the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/linewise-${{ github.ref_name }}.apk
            release/linewise-${{ github.ref_name }}.apk.sha256
          generate_release_notes: true

  web:
    name: Build and deploy the web app
    runs-on: ubuntu-latest
    # Deploys to Cloudflare Pages. Needs two repository secrets; without them the site is built and
    # checked but not deployed:
    #   CLOUDFLARE_API_TOKEN   an API token with the "Cloudflare Pages: Edit" permission
    #   CLOUDFLARE_ACCOUNT_ID  the account that owns the "linewise" Pages project
    # Optional: REPO_ADMIN_TOKEN, a fine-grained GitHub token with "Administration: Read and write" on
    # this repository, keeps the repository's Website link pointing at the site.
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      REPO_ADMIN_TOKEN: ${{ secrets.REPO_ADMIN_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Unit tests
        run: npm test -- --ci

      - name: Stamp the version from the tag
        run: node scripts/set-version.js "$GITHUB_REF_NAME"

      - name: Build the web app
        run: npm run build:web

      - name: Deploy to Cloudflare Pages
        if: env.CLOUDFLARE_API_TOKEN != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
          command: pages deploy dist-web --project-name=linewise --branch=main --commit-dirty=true

      - name: Note the skipped deploy
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::notice::CLOUDFLARE_API_TOKEN is not set, so the web app was built but not deployed."

      # The site is already live at this point, so a problem here (say, an expired token) is reported
      # without failing the release.
      - name: Point the repository's Website link at the site
        if: env.CLOUDFLARE_API_TOKEN != '' && env.REPO_ADMIN_TOKEN != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.REPO_ADMIN_TOKEN }}
        run: node scripts/set-homepage.js linewise

      - name: Note the skipped Website link update
        if: env.CLOUDFLARE_API_TOKEN != '' && env.REPO_ADMIN_TOKEN == ''
        run: echo "::notice::REPO_ADMIN_TOKEN is not set, so the repository's Website link was not checked."
