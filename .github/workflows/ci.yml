name: CI

on:
  # Branches only: a version tag runs the same checks inside the release workflow.
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Typecheck, lint, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test -- --ci

      - name: Offline guarantee (no network code, no INTERNET permission)
        run: npm run check:offline

      - name: JavaScript bundle builds
        run: npx expo export --platform android --output-dir dist-check
