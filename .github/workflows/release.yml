name: Release APK

# Pushing a tag like v1.2.3 builds a signed release APK and attaches it to a GitHub Release.
# Needs four repository secrets (Settings > Secrets and variables > Actions):
#   ANDROID_KEYSTORE_BASE64    the .jks / .keystore file, base64 encoded
#   ANDROID_KEYSTORE_PASSWORD  store password
#   ANDROID_KEY_ALIAS          key alias
#   ANDROID_KEY_PASSWORD       key password
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  apk:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - run: npm ci

      # Do not ship a build that fails the checks.
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test -- --ci

      - name: Stamp the version from the tag
        run: node scripts/set-version.js "$GITHUB_REF_NAME"

      - name: Generate the Android project
        run: npx expo prebuild --platform android --no-install --clean

      - name: Restore the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ANDROID_KEYSTORE_BASE64 is not set; refusing to publish an APK signed with the debug key." >&2
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          echo "LINEWISE_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Build the release APK
        working-directory: android
        env:
          LINEWISE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          LINEWISE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          LINEWISE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon --console=plain

      - name: Check the APK
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          node scripts/check-offline.js --apk "$APK"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs "$APK" | tee "$RUNNER_TEMP/certs.txt"
          if grep -qi "Android Debug" "$RUNNER_TEMP/certs.txt"; then
            echo "The APK is signed with the debug key." >&2
            exit 1
          fi

      - name: Name the files
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/release/app-release.apk "release/linewise-${GITHUB_REF_NAME}.apk"
          (cd release && sha256sum "linewise-${GITHUB_REF_NAME}.apk" > "linewise-${GITHUB_REF_NAME}.apk.sha256")

      - name: Publish the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/linewise-${{ github.ref_name }}.apk
            release/linewise-${{ github.ref_name }}.apk.sha256
          generate_release_notes: true
